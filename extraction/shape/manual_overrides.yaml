# manual_overrides.yaml — human adjudications for transcript-to-episode mapping.
#
# `resolve.py` checks this FIRST, before any automatic matching, so anything
# recorded here wins outright and is reported with method "manual-override".
#
# Use it for two situations:
#   1. A file the resolver could not place (confidence "none"). It deliberately
#      refuses to guess below its name-similarity floor, because a
#      confident-looking wrong answer is worse than an admitted gap.
#   2. A file the resolver placed WRONGLY. Check the flagged ones first — run
#      `build_txt_records.py --resolve-report` and look at anything marked
#      weak, name-override, or number.
#
# Format — key is the transcript filename exactly as it appears on disk:
#
#   overrides:
#     Some-File.txt:
#       url: https://www.thegreatsimplification.com/frankly-original/<slug>
#       note: how you confirmed it (e.g. "watched the video intro")
#
#     Some-Other-File.txt:
#       skip: true
#       note: why this file should not be mapped at all
#
# To disable an override, comment it out or delete it; nothing else depends on it.

overrides:

  # ---------------------------------------------------------------------------
  # Confirmed by MJSullivan, 2026-08-21.
  #
  # Both episodes have a slug carrying NO episode number, which is why automatic
  # resolution declined them: with no number to corroborate, each had only a
  # partial title match to go on (0.74 and 0.38 similarity, against a 0.85
  # floor). Both were confirmed against the site's own titles, quoted below —
  # each matches its slug's title verbatim.
  # ---------------------------------------------------------------------------

  # Site title: "The 10 Core Myths Still Taught in Business Schools"
  # The filename's shorter "10 Core Myths of Business Schools" is a paraphrase,
  # which is what held the similarity to 0.74.
  Frankly-099-10-Core-Myths-of-Business-Schools.txt:
    url: https://www.thegreatsimplification.com/frankly-original/the-10-core-myths-still-taught-in-business-schools
    note: >
      Frankly 99. Confirmed by MJSullivan 2026-08-21; site title matches
      verbatim. Slug carries no episode number, so nothing corroborated the
      filename's "099" automatically.

  # Two Jean-Marc Jancovici transcripts exist and both initially resolved to
  # 84-jean-marc-jancovici, because this episode's slug carries NO number and
  # its long trailing subtitle held name similarity to 0.80 — just under the
  # 0.85 floor. Collision detection correctly rejected the duplicate claim but
  # then had no candidate left to fall back to.
  #
  # Settled by fetching the page: its own label reads "Ep 175 | Jean-Marc
  # Jancovici", which matches the filename's 175 exactly.
  TGS175Jean-MarcJancoviciTranscript.txt:
    url: https://www.thegreatsimplification.com/episode/jean-marc-jancovici-sobriete-vs-poverty-preparing-for-a-new-cultural-paradigm
    note: >
      Episode 175, "Sobriete vs Poverty: Preparing for a New Cultural Paradigm"
      (published 2025-04-30). Confirmed 2026-08-21 from the page's own epi_label
      "Ep 175 | Jean-Marc Jancovici". The other Jancovici transcript
      (TGS-084-...) correctly keeps 84-jean-marc-jancovici.

  # Site title: "Wide Boundary News: The Iranian War, Rising Gas Prices, and the
  # Single Point Failure"
  # "WBN" is Wide Boundary News, and the filename's date decodes onto the slug
  # exactly: 10 March 2026 -> 3-10-26. That date was the real signal here; the
  # raw string similarity was only 0.38 because the filename carries a date
  # where the title carries subject matter.
  Frankly-130-WBN-10-March-2026.docx.txt:
    url: https://www.thegreatsimplification.com/frankly-original/wide-boundary-news-3-10-26
    note: >
      Frankly 130. Confirmed by MJSullivan 2026-08-21. Note the numbered Wide
      Boundary News entries nearby are 121/124/127/141 — this one is unnumbered
      on the site, so "130" comes from the filename alone.

  # ---------------------------------------------------------------------------
  # AUDIO-ONLY EPISODES (28) — collected by MJSullivan, 2026-08-21.
