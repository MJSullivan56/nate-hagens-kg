# known_absent.yaml — fields confirmed absent at the source, not merely unfilled.
#
# This repo's standing principle (CLAUDE.md, the bootstrap-a-person procedure):
# "checked, confirmed absent" and "nobody got around to checking yet" are
# different states and are worth distinguishing. The gap report cannot tell them
# apart on its own, so record the checked-and-absent ones here. They then appear
# in the report as CONFIRMED ABSENT rather than as an open gap.
#
# Format:
#   <record_id>:
#     <field_name>:
#       checked_on: YYYY-MM-DD
#       method: how it was checked
#       note: what was found

