guest_bios:
- name: Ed Conway
  bio: 'Ed Conway is a writer and broadcaster. He is the Economics and Data Editor of Sky News and has
    written for many newspapers and publications, including the New York Times, the Times of London and
    the New Statesman. His latest book, Material World , was an Economist and Sunday Times Book of the
    Year and was shortlisted for the 2023 FT Business Book of the Year Award. He has also written two
    other critically acclaimed and bestselling books and has won numerous awards for his journalism. He
    was educated at Oxford and Harvard. He lives in London.

    Ed Conway

    Episode 127 Jun 12, 2024 Recorded on: May 7, 2024'
guests:
- Ed Conway
description: 'In contrast to ‘The Great Simplification’, some might call the events of the last few hundred
  years a ‘Great Complexification’ in terms of relationships, governance, supply chains, and many other
  human activities. Today’s conversation with economics journalist Ed Conway focuses on the six essential
  resources that underpin our modern economies – sand, salt, iron, copper, oil, and lithium – and dives
  into the (often unseen) environmental and human costs of extracting them, as well as the surprisingly
  fragile global supply chains they fuel.

  In order to understand what possibilities – and dangers – may await us in the future, we need to understand
  the realities and constraints of the present, as well as the fail points of the past. What does it take
  to mine, refine, and transform the materials that are foundational to the world around us – which many
  of us now take for granted? How can we ensure the stability of global supply chains, and could we predict
  potential disruptions and chokepoints before they arise? If we understood the intricate web of complexity,
  energy, and resources that go into everything we consume, would it change our expectations for how much
  we need in order to live a good and fulfilling life?'
