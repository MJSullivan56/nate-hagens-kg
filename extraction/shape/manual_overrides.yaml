  # player, and a YouTube search returns only short CLIPS uploaded months later,
  # which the date check correctly refuses. So youtube_url is genuinely absent
  # here, not merely unfound, and podcast_mp3_url is the real media link.
  #
  # Recorded here rather than in the emitted records because out_txt/ is
  # gitignored and wiped on every rebuild; this file is tracked, so the values
  # survive. series is set to podcast_interview to distinguish them.
  # ---------------------------------------------------------------------------

